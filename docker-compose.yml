services:
  user-db:
    image: postgres:18
    env_file:
      - ./UserService/.env
    volumes:
      - user_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 5
  user-service:
    build: ./UserService
    image: userservice
    container_name: UserService
    restart: always
    pull_policy: build
    ports:
      - "8000:8000"
    env_file:
      - ./UserService/.env
    depends_on:
      user-db:
        condition: service_healthy
  reservation-db:
    image: postgres:18
    env_file:
      - ./ReservationService/.env
    volumes:
      - reservation_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 5
  reservation-service:
    build: ./ReservationService
    image: reservationservice
    container_name: ReservationService
    restart: always
    pull_policy: build
    ports:
      - "8001:8000"
    env_file:
      - ./ReservationService/.env
    depends_on:
      reservation-db:
        condition: service_healthy
  payment-db:
    image: postgres:18
    env_file:
      - ./PaymentService/.env
    volumes:
      - payment_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 5
  payment-service:
    build: ./PaymentService
    image: paymentservice
    container_name: PaymentService
    restart: always
    pull_policy: build
    ports:
      - "8002:8000"
    env_file:
      - ./PaymentService/.env
    depends_on:
      payment-db:
        condition: service_healthy
  library-service:
    build: ./LibraryService
    image: libraryservice
    container_name: LibraryService
    restart: always
    pull_policy: build
    ports:
      - "8003:8000"
  fine-service:
    build: ./FineService
    image: fineservice
    container_name: FineService
    restart: always
    pull_policy: build
    ports:
      - "8004:8000"

volumes:
  user_db_data:
  reservation_db_data:
  payment_db_data: